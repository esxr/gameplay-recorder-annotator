<!doctype html>
<html><head><meta charset="utf-8"><title>Test Game</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block;width:1280px;height:720px}</style>
</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
"use strict";
// Deterministic auto-playing test game. Game state is a pure function of gf (game frame, 60/s).
const W = 1280, H = 720, FPS = 60, GAME_FRAMES = 70 * FPS;
const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext('2d');
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(12345);
// Background decoration (seeded)
const stars = []; for (let i = 0; i < 80; i++) stars.push({ x: rng() * W, y: 90 + rng() * 480, r: 1 + rng() * 2 });
// Shot schedule: every 100-160 frames (seeded), avoiding flash frames.
const shots = []; { let g = 90; while (g < GAME_FRAMES - 30) { shots.push(g); g += 100 + Math.floor(rng() * 60); } }
// Flashes: start gf, length (1 or 2 frames). Spaced >= 2 s, not on whole seconds.
const FLASHES = [[317, 1], [611, 2], [953, 1], [1277, 2], [1589, 1], [2213, 2], [2531, 1], [2867, 2], [3391, 1], [3713, 2]];
const flashSet = new Set(); for (const [s, l] of FLASHES) for (let k = 0; k < l; k++) flashSet.add(s + k);
const LOAD_START = 3000, LOAD_END = 3060; // 1 s loading screen
const OBJ_CHANGE = 2100;                  // 35 s
const COVER = { x: 580, y: 140, w: 130, h: 420 };
const ENEMIES = [
  { id: 1, color: '#e53935', spawn: 0, die: 1e9, path: t => [640 + 420 * Math.sin(t * 0.55), 250 + 40 * Math.sin(t * 1.3)] },
  { id: 2, color: '#43a047', spawn: 0, die: 1e9, path: t => [640 + 360 * Math.sin(t * 0.37 + 1.0), 420 + 50 * Math.sin(t * 0.9)] },
  { id: 3, color: '#1e88e5', spawn: 0, die: 2400, path: t => [290 + 150 * Math.sin(t * 0.6), 330 + 110 * Math.cos(t * 0.45)] },
  { id: 4, color: '#fdd835', spawn: 1500, die: 1e9, path: t => [880 + 300 * Math.sin(t * 0.3 + 2.0), 480 + 60 * Math.cos(t * 0.7)] },
];
const ESZ = 64;

function sceneAt(gf) { if (gf >= GAME_FRAMES) return 'gameover'; if (gf >= LOAD_START && gf < LOAD_END) return 'loading'; return gf < LOAD_START ? 'level1' : 'level2'; }
function hudAt(gf) {
  let ammo = 30, health = 100, score = 0;
  for (const s of shots) { if (s > gf) break; ammo -= 1; if (ammo <= 0) ammo = 30; score += 50; }
  for (const [s] of FLASHES) { if (s > gf) break; health -= 7; }
  if (gf >= 2400) score += 500; // kill of enemy 3
  return { health, ammo, score };
}
function objectiveAt(gf) { return gf < OBJ_CHANGE ? 'Reach the gate' : 'Defend the core'; }
function enemiesAt(gf) {
  const sc = sceneAt(gf); if (sc === 'loading' || sc === 'gameover') return [];
  const t = gf / FPS, out = [];
  for (const e of ENEMIES) {
    if (gf < e.spawn || gf >= e.die) continue;
    const [cx, cy] = e.path(t - e.spawn / FPS);
    out.push({ e, x: cx - ESZ / 2, y: cy - ESZ / 2, w: ESZ, h: ESZ });
  }
  return out;
}
// visible box after cover occlusion (cover spans enemies' full height so clipping is horizontal)
function visibleBox(b) {
  const cx0 = COVER.x, cx1 = COVER.x + COVER.w;
  const vcov = b.y >= COVER.y && b.y + b.h <= COVER.y + COVER.h;
  let x0 = b.x, x1 = b.x + b.w;
  if (vcov && x1 > cx0 && x0 < cx1) {
    if (x0 >= cx0 && x1 <= cx1) return null;
    if (x0 < cx0 && x1 > cx1) { /* spans cover: keep full box */ }
    else if (x0 < cx0) x1 = cx0; else x0 = cx1;
  }
  if (x1 - x0 < 2) return null;
  return { x: x0, y: b.y, w: x1 - x0, h: b.h };
}

function drawEnemy(b, color, id) {
  ctx.fillStyle = color; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#111'; ctx.fillRect(b.x + 6, b.y + 6, b.w - 12, 10);
  ctx.fillStyle = '#fff'; ctx.fillRect(b.x + 14, b.y + 24, 12, 12); ctx.fillRect(b.x + b.w - 26, b.y + 24, 12, 12);
  ctx.fillStyle = '#000'; ctx.fillRect(b.x + 18, b.y + 28, 5, 5); ctx.fillRect(b.x + b.w - 22, b.y + 28, 5, 5);
  ctx.fillRect(b.x + 16, b.y + 46, b.w - 32, 6);
}
function drawBarcode(gf) {
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, 16 * 12 + 8, 20);
  for (let i = 0; i < 16; i++) { const bit = (gf >> (15 - i)) & 1; ctx.fillStyle = bit ? '#fff' : '#000'; ctx.fillRect(4 + i * 12, 4, 12, 12); }
}
function render(gf) {
  const sc = sceneAt(gf);
  if (sc === 'loading') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ddd'; ctx.font = 'bold 72px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('LOADING', W / 2, H / 2);
  } else {
    ctx.fillStyle = sc === 'level1' ? '#26324a' : '#4a2a2a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = sc === 'level1' ? '#3d4d6b' : '#6b3d33'; ctx.fillRect(0, 560, W, 160);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; for (const s of stars) ctx.fillRect(s.x, s.y, s.r, s.r);
    const es = enemiesAt(gf);
    for (const b of es) drawEnemy(b, b.e.color, b.e.id);
    ctx.fillStyle = '#8d8d8d'; ctx.fillRect(COVER.x, COVER.y, COVER.w, COVER.h);
    ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 4; ctx.strokeRect(COVER.x + 2, COVER.y + 2, COVER.w - 4, COVER.h - 4);
    // muzzle tracer for shots (brief, small)
    for (const s of shots) if (gf >= s && gf < s + 4) { ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W / 2, H - 30); ctx.lineTo(W / 2 + 40, H - 200); ctx.stroke(); }
  }
  const hud = hudAt(gf);
  // HUD bottom-left panel
  ctx.fillStyle = 'rgba(10,10,14,0.88)'; ctx.fillRect(20, 590, 330, 110);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 40px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('HEALTH ' + hud.health, 36, 638); ctx.fillText('AMMO ' + hud.ammo, 36, 684);
  // score top-right
  ctx.fillStyle = 'rgba(10,10,14,0.88)'; ctx.fillRect(W - 330, 20, 310, 60);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.fillText('SCORE ' + hud.score, W - 36, 64);
  // objective top-center
  ctx.fillStyle = 'rgba(10,10,14,0.88)'; ctx.fillRect(W / 2 - 220, 20, 440, 50);
  ctx.fillStyle = '#ffd54f'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center'; ctx.fillText(objectiveAt(gf), W / 2, 56);
  if (sc === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5252'; ctx.font = 'bold 96px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GAME OVER', W / 2, H / 2);
  }
  if (flashSet.has(gf)) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(0, 0, W, H); }
  drawBarcode(gf);
}
function truthAt(gf, rendered) {
  const sc = sceneAt(gf);
  const enemies = [];
  for (const b of enemiesAt(gf)) { const v = visibleBox(b); if (v) enemies.push({ id: b.e.id, x: +(v.x / W).toFixed(4), y: +(v.y / H).toFixed(4), w: +(v.w / W).toFixed(4), h: +(v.h / H).toFixed(4) }); }
  return { gf, sync: gf & 0xffff, hud: hudAt(gf), objective: objectiveAt(gf), enemies, flash: flashSet.has(gf), scene: sc, rendered };
}

// ---- runtime ----
let buf = [], started = false, t0 = 0, lastGf = -1, done = false, skipped = 0;
function flush(final) {
  if (!buf.length && !final) return;
  const body = buf.map(r => JSON.stringify(r)).join('\n'); buf = [];
  fetch('/truth' + (final ? '?final=1' : ''), { method: 'POST', body }).catch(() => {});
}
function frame(now) {
  if (!started) { render(0); requestAnimationFrame(frame); return; }
  if (!t0) t0 = now;
  const gf = Math.floor((now - t0) * FPS / 1000 + 1e-6);
  if (gf !== lastGf && !done) {
    for (let g = lastGf + 1; g < gf && g <= GAME_FRAMES; g++) { buf.push(truthAt(g, false)); skipped++; }
    if (gf <= GAME_FRAMES) { render(gf); buf.push(truthAt(gf, true)); }
    lastGf = gf;
    if (buf.length >= 30) flush(false);
    if (gf >= GAME_FRAMES) { done = true; render(GAME_FRAMES); flush(true); fetch('/done?skipped=' + skipped).catch(() => {}); }
  }
  requestAnimationFrame(frame);
}
setInterval(() => flush(false), 500);
// report geometry, wait for /start
function geo() { return { screenX: window.screenX, screenY: window.screenY, outerW: window.outerWidth, outerH: window.outerHeight, innerW: window.innerWidth, innerH: window.innerHeight, dpr }; }
fetch('/geo', { method: 'POST', body: JSON.stringify(geo()) }).catch(() => {});
const poll = setInterval(() => {
  fetch('/state').then(r => r.json()).then(s => {
    fetch('/geo', { method: 'POST', body: JSON.stringify(geo()) }).catch(() => {});
    if (s.go && !started) { started = true; clearInterval(poll); }
  }).catch(() => {});
}, 100);
requestAnimationFrame(frame);
</script></body></html>
